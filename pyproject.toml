[project]
name = "b2b-sales-agent"
version = "0.1.0"
description = "Multi-tenant B2B sales agent over WhatsApp: hybrid search, LangGraph tools, idempotent webhooks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis>=5.2",
    "pgvector>=0.3",
    "alembic>=1.14",
    "fastembed>=0.5",
    "pymupdf4llm>=0.0.20",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs Postgres and Redis running (docker compose up)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]
